[package]
name = "ceph-backup"
version = "0.2.0"
edition = "2024"
publish = false

[profile.release]
opt-level = 's'
lto = true

[dependencies]
ceph = "3.2.5"
chrono = "0.4.45"
clap = { version = "4.6.9", features = ["derive", "env"] }
crossbeam-channel = "0.5.17"
ctrlc = { version = "3.5.3", features = ["termination"] }
duct = "1.1.2"
env_logger = "0.11.12"
eyre = "0.6.14"
glob-match = "0.2.1"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
socket2 = "0.6.5"
zstd = "0.14.4"
